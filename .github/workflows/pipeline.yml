name: pipeline

# Three checks, one per claim the repository makes about itself:
#   tests          — the SPEC §11 acceptance suite, on the Python range the README states
#   pandas-compat  — requirements.txt says pandas 2.x and 3.x both work. This is where that is true or not
#   reproducible   — every committed artifact regenerates byte-for-byte from a clean checkout
#
# No API key, no secrets, no network beyond installing pandas: a default run
# imports nothing that can open a socket, which is itself one of the tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests · python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README promises; 3.14 is what the work was done on.
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "import sys, pandas; print(sys.version, 'pandas', pandas.__version__)"
      - run: python -m unittest discover tests -v

  pandas-compat:
    name: pandas ${{ matrix.pandas }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ["<3", ">=3"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "pandas${{ matrix.pandas }}"
      - run: python -c "import pandas; print('pandas', pandas.__version__)"
      - run: python -m unittest discover tests

  reproducible:
    name: committed artifacts regenerate exactly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Every command the README documents, in the order it documents them.
      - name: Run both flows for all four roles
        run: |
          python pipeline/main.py run --job JOB001
          python pipeline/main.py match --job JOB002
          python pipeline/main.py match --job JOB003
          python pipeline/main.py match --job JOB004

      - name: Run the edge-case fixture
        run: python pipeline/main.py run --job JOB001 --data-dir data/edge_cases

      # SPEC §11: "produces four files from a clean checkout" and "two consecutive
      # runs produce byte-identical output". If a committed CSV, recruiter view,
      # pool file or landing page has gone stale against the code that writes it,
      # the working tree is dirty here and this fails with the diff.
      - name: Nothing changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::A committed artifact no longer matches what the pipeline produces."
            git status --short
            git --no-pager diff
            exit 1
          fi
          echo "All committed artifacts regenerated byte-for-byte."
